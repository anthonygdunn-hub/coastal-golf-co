<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offers | Coastal Golf Co</title>
<style>body{margin:0;background:#f8f2e2;color:#022042;font:600 17px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px}a{color:#8a5a12;font-weight:800}</style>
</head>
<body>
<p>Offers now live in your website editor.<br><a id="go" href="https://dunnworks.io/editor/coastal-golf-co/#offers">Open the editor</a></p>
<script>
/* The offers maker moved into Stuart's editor (Offers tab). Anything typed here before is carried across once. */
(function(){
  var to = 'https://dunnworks.io/editor/coastal-golf-co/#offers';
  try {
    var s = JSON.parse(localStorage.getItem('cgc-offers-v1') || 'null');
    if (s && s.rows && s.rows.some(function(r){ return r && (r.p || '').trim(); })) {
      to = 'https://dunnworks.io/editor/coastal-golf-co/#offers-import=' + encodeURIComponent(JSON.stringify(s));
      localStorage.removeItem('cgc-offers-v1');
    }
  } catch(e){}
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
