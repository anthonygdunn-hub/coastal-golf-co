<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offers maker | Coastal Golf Co</title>
<link rel="icon" href="/favicon-32.png">
<style>
@font-face{font-family:Oswald;font-weight:700;src:url(fonts/Oswald_700Bold.ttf)}
@font-face{font-family:Oswald;font-weight:500;src:url(fonts/Oswald_500Medium.ttf)}
@font-face{font-family:Mulish;font-weight:800;src:url(fonts/Mulish_800ExtraBold.ttf)}
@font-face{font-family:Mulish;font-weight:700;src:url(fonts/Mulish_700Bold.ttf)}
@font-face{font-family:Mulish;font-weight:600;src:url(fonts/Mulish_600SemiBold.ttf)}
@font-face{font-family:"Kaushan Script";src:url(fonts/KaushanScript_400Regular.ttf)}
:root{--navy:#022042;--gold:#CB9A31;--gold2:#E3C27A;--cream:#F8F2E2;--red:#B3261E;--ink:#1E2433;--line:#E2D6B6}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:600 16px/1.4 Mulish,system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:50%;background:var(--cream)}
header h1{margin:0;font:700 22px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em}
header p{margin:2px 0 0;font-size:13px;color:#B9C4D2}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:20px}
@media(min-width:900px){main{grid-template-columns:1fr 1fr;align-items:start}.prev{position:sticky;top:16px}}
h2{margin:0 0 8px;font:700 18px Oswald,sans-serif;text-transform:uppercase;color:var(--navy);letter-spacing:.03em}
label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin:0 0 4px}
input{width:100%;font:700 16px Mulish,sans-serif;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--gold)}
.box{background:#fff;border-radius:14px;padding:14px;box-shadow:0 0 0 1px var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{border-left:5px solid var(--gold);background:#FCFAF4;border-radius:10px;padding:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr 1fr}
.row .p{grid-column:1/-1;display:flex;gap:8px}
.row .p input{flex:1}
.x{flex:none;width:44px;border:0;border-radius:10px;background:#F3E6E4;color:var(--red);font:800 20px Mulish;cursor:pointer}
.rows{display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font:700 17px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.add{background:var(--cream);color:var(--navy);box-shadow:inset 0 0 0 2px var(--gold);width:100%;margin-top:10px}
.go{background:#25D366;color:#073B1E}
.dl{background:var(--navy);color:#fff}
.cp{background:var(--gold2);color:var(--navy)}
.acts{display:grid;gap:10px;margin-top:12px}
@media(min-width:520px){.acts{grid-template-columns:1fr 1fr 1fr}}
.clr{background:none;border:0;color:var(--red);font:800 14px Mulish;text-decoration:underline;cursor:pointer;padding:6px 0;margin-top:8px}
canvas{width:100%;height:auto;border-radius:12px;box-shadow:0 6px 24px rgba(2,32,66,.18);display:block}
.hint{font-size:13px;color:#6B7280;margin:8px 0 0}
#msg{min-height:20px;font-size:14px;font-weight:800;color:#0E7A3B;margin-top:8px}
</style>
</head>
<body>
<header><img src="badge.svg" alt=""><div><h1>Weekly offers maker</h1><p>Fill in the offers, then share the picture to WhatsApp</p></div></header>
<main>
  <section>
    <div class="box">
      <h2>Heading</h2>
      <div class="two">
        <div><label for="title">Title</label><input id="title" value="Special offers"></div>
        <div><label for="sub">Week or dates</label><input id="sub" placeholder="e.g. w/c 16 November"></div>
      </div>
    </div>
    <div class="box" style="margin-top:14px">
      <h2>Products</h2>
      <div class="rows" id="rows"></div>
      <button class="btn add" id="add" type="button">+ Add product</button>
      <p class="hint">Leave "Was" empty to show just one price. Leave "Stock left" empty to hide it.</p>
    </div>
    <div class="box" style="margin-top:14px">
      <h2>Small print</h2>
      <label for="note">Line under the offers</label><input id="note" value="While stocks last">
      <button class="clr" id="clear" type="button">Clear all products</button>
    </div>
  </section>
  <section class="prev">
    <h2>Preview</h2>
    <canvas id="cv" width="1080" height="1350"></canvas>
    <div class="acts">
      <button class="btn go" id="share" type="button">Share to WhatsApp</button>
      <button class="btn dl" id="dl" type="button">Download picture</button>
      <button class="btn cp" id="copy" type="button">Copy as text</button>
    </div>
    <div id="msg"></div>
  </section>
</main>
<script>
(function(){
var KEY='cgc-offers-v1', $=function(id){return document.getElementById(id);};
var badge=new Image(); badge.src='badge.svg';
var state={title:'Special offers',sub:'',note:'While stocks last',rows:[{p:'',q:'',w:'',n:''},{p:'',q:'',w:'',n:''},{p:'',q:'',w:'',n:''}]};
try{ var s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.rows) state=s; }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function money(v){ v=String(v||'').replace(/[£,\s]/g,''); if(v==='') return ''; var n=parseFloat(v); if(isNaN(n)) return String(v); return '£'+(n%1? n.toFixed(2): String(n)); }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function drawRows(){
  var h=''; state.rows.forEach(function(r,i){
    h+='<div class="row" data-i="'+i+'"><div class="p"><input data-k="p" placeholder="Product, e.g. Golf Pride Tour Velvet" value="'+esc(r.p)+'" aria-label="Product"><button class="x" type="button" aria-label="Remove">×</button></div>'+
       '<div><label>Stock left</label><input data-k="q" inputmode="numeric" placeholder="e.g. 3" value="'+esc(r.q)+'"></div>'+
       '<div><label>Was £</label><input data-k="w" inputmode="decimal" placeholder="e.g. 11" value="'+esc(r.w)+'"></div>'+
       '<div><label>Now £</label><input data-k="n" inputmode="decimal" placeholder="e.g. 8.80" value="'+esc(r.n)+'"></div></div>';
  }); $('rows').innerHTML=h;
}
$('rows').addEventListener('input',function(e){ var k=e.target.getAttribute('data-k'); if(!k) return; var i=+e.target.closest('.row').getAttribute('data-i'); state.rows[i][k]=e.target.value; save(); render(); });
$('rows').addEventListener('click',function(e){ if(!e.target.classList.contains('x')) return; var i=+e.target.closest('.row').getAttribute('data-i'); state.rows.splice(i,1); if(!state.rows.length) state.rows.push({p:'',q:'',w:'',n:''}); save(); drawRows(); render(); });
$('add').onclick=function(){ state.rows.push({p:'',q:'',w:'',n:''}); save(); drawRows(); render(); var ins=$('rows').querySelectorAll('.row'); ins[ins.length-1].querySelector('input').focus(); };
$('clear').onclick=function(){ state.rows=[{p:'',q:'',w:'',n:''}]; save(); drawRows(); render(); };
['title','sub','note'].forEach(function(id){ $(id).value=state[id]||''; $(id).addEventListener('input',function(){ state[id]=this.value; save(); render(); }); });

function filled(){ return state.rows.filter(function(r){ return (r.p||'').trim(); }); }
function wrap(ctx,text,maxW){ var words=String(text).split(/\s+/), lines=[], cur=''; words.forEach(function(w){ var t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=w; } else cur=t; }); if(cur) lines.push(cur); return lines; }

var cv=$('cv'), ctx=cv.getContext('2d'), W=1080;
function render(){
  var rows=filled(); if(!rows.length) rows=[{p:'Your first offer',q:'',w:'',n:''}];
  // measure rows
  ctx.font='800 40px Mulish'; var PW=530, layout=rows.map(function(r){ var ls=wrap(ctx,r.p,PW).slice(0,3); return {r:r,ls:ls,h:Math.max(112, 40+ls.length*48)}; });
  var headH=330, thH=72, footH=250, bodyH=layout.reduce(function(a,x){return a+x.h;},0);
  var H=Math.max(1080, headH+thH+bodyH+120+footH); cv.height=H;
  ctx.fillStyle='#F8F2E2'; ctx.fillRect(0,0,W,H);
  // header
  ctx.fillStyle='#022042'; ctx.fillRect(0,0,W,headH);
  ctx.fillStyle='#CB9A31'; ctx.fillRect(0,headH-10,W,10);
  ctx.save(); ctx.beginPath(); ctx.arc(170,165,118,0,Math.PI*2); ctx.fillStyle='#F8F2E2'; ctx.fill(); ctx.restore();
  if(badge.complete&&badge.naturalWidth) ctx.drawImage(badge,57,52,226,226);
  ctx.textAlign='left'; ctx.fillStyle='#E3C27A';
  var t=(state.title||'Special offers').toUpperCase(), fs=104; ctx.font='700 '+fs+'px Oswald'; while(ctx.measureText(t).width>720&&fs>56){fs-=4;ctx.font='700 '+fs+'px Oswald';}
  ctx.fillText(t,320,state.sub?170:200);
  if(state.sub){ ctx.fillStyle='#fff'; var fs2=52; ctx.font=fs2+'px "Kaushan Script"'; while(ctx.measureText(state.sub).width>720&&fs2>30){fs2-=2;ctx.font=fs2+'px "Kaushan Script"';} ctx.fillText(state.sub,322,245); }
  // table head
  var y=headH+40, X0=50, X1=W-50, cP=X0+30, cQ=650, cW=800, cN=X1-30;
  ctx.fillStyle='#022042'; roundRect(X0,y,X1-X0,thH,16); ctx.fill();
  ctx.fillStyle='#E3C27A'; ctx.font='700 34px Oswald'; ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillText('PRODUCT',cP,y+thH/2);
  ctx.textAlign='center'; ctx.fillText('STOCK',cQ+40,y+thH/2); ctx.fillText('WAS',cW+20,y+thH/2);
  ctx.textAlign='right'; ctx.fillText('NOW',cN,y+thH/2);
  y+=thH+8;
  layout.forEach(function(L,i){
    var r=L.r; ctx.fillStyle=i%2?'#FCFAF4':'#FFFFFF'; roundRect(X0,y,X1-X0,L.h-8,14); ctx.fill();
    ctx.fillStyle='#CB9A31'; ctx.fillRect(X0,y+12,8,L.h-32);
    var mid=y+(L.h-8)/2;
    ctx.textAlign='left'; ctx.fillStyle='#1E2433'; ctx.font='800 40px Mulish';
    L.ls.forEach(function(l,k){ ctx.fillText(l,cP, mid-(L.ls.length-1)*24+k*48); });
    if(String(r.q).trim()){ var low=parseFloat(r.q)<=2; ctx.textAlign='center'; ctx.fillStyle=low?'#B3261E':'#022042'; ctx.font='700 36px Oswald'; ctx.fillText(String(r.q).trim()+' LEFT',cQ+40,mid); }
    var was=money(r.w), now=money(r.n);
    if(was&&now){ ctx.textAlign='center'; ctx.fillStyle='#8A93A6'; ctx.font='800 36px Mulish'; ctx.fillText(was,cW+20,mid); var ww=ctx.measureText(was).width; ctx.fillStyle='#B3261E'; ctx.fillRect(cW+20-ww/2-6,mid-3,ww+12,6); }
    if(now||was){ ctx.textAlign='right'; ctx.fillStyle='#B3261E'; ctx.font='700 58px Oswald'; ctx.fillText(now||was,cN,mid+2); }
    y+=L.h;
  });
  if(state.note){ ctx.textAlign='center'; ctx.fillStyle='#8a5a12'; ctx.font='800 34px Mulish'; ctx.fillText(state.note,W/2,y+46); }
  // footer
  var fy=H-footH; ctx.fillStyle='#022042'; ctx.fillRect(0,fy,W,footH); ctx.fillStyle='#CB9A31'; ctx.fillRect(0,fy,W,10);
  ctx.textAlign='center'; ctx.fillStyle='#E3C27A'; ctx.font='500 32px Oswald'; ctx.fillText('CALL OR TEXT STUART',W/2,fy+62);
  ctx.fillStyle='#fff'; ctx.font='700 76px Oswald'; ctx.fillText('07792 554989',W/2,fy+130);
  ctx.font='800 32px Mulish'; ctx.fillStyle='#D6DEE8'; ctx.fillText('coastalgolfco.co.uk · hello@coastalgolfco.co.uk',W/2,fy+200);
  ctx.textBaseline='alphabetic';
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function text(){
  var out='*'+(state.title||'Special offers').toUpperCase()+'*'+(state.sub?' – '+state.sub:'')+'\n\n';
  filled().forEach(function(r){ var was=money(r.w), now=money(r.n); out+='• '+r.p.trim()+(now&&was?' – ~'+was+'~ *'+now+'*':(now||was?' – *'+(now||was)+'*':''))+(String(r.q).trim()?' ('+String(r.q).trim()+' left)':'')+'\n'; });
  if(state.note) out+='\n_'+state.note+'_\n';
  return out+'\nCall or text Stuart on 07792 554989\ncoastalgolfco.co.uk';
}
function fname(){ return 'CGC '+(state.title||'offers')+(state.sub?' '+state.sub:'')+'.png'; }
function blob(){ return new Promise(function(res){ cv.toBlob(res,'image/png'); }); }
function say(m){ $('msg').textContent=m; setTimeout(function(){ if($('msg').textContent===m) $('msg').textContent=''; },4000); }
$('dl').onclick=function(){ blob().then(function(b){ var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname(); a.click(); say('Picture saved'); }); };
$('share').onclick=function(){
  if(!filled().length){ say('Add at least one product first'); return; }
  blob().then(function(b){
    var f=new File([b],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f]}).catch(function(){}); }
    else { var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname(); a.click(); say('Picture saved. On a computer, drag it into WhatsApp Web'); }
  });
};
$('copy').onclick=function(){ var t=text(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ say('Copied. Paste it into WhatsApp'); },function(){ window.prompt('Copy this text:',t); }); };

drawRows();
Promise.all([document.fonts.load('700 40px Oswald'),document.fonts.load('500 32px Oswald'),document.fonts.load('800 40px Mulish'),document.fonts.load('40px "Kaushan Script"'),new Promise(function(r){ if(badge.complete) r(); else { badge.onload=r; badge.onerror=r; } })]).then(render,render);
render();
if(document.fonts&&document.fonts.addEventListener) document.fonts.addEventListener('loadingdone',render);
})();
</script>
</body>
</html>
